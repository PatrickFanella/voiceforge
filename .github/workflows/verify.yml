name: Verify

on:
  workflow_call:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run doctor

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: voiceforge, POSTGRES_USER: voiceforge, POSTGRES_PASSWORD: voiceforge }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voiceforge" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
        env: { DATABASE_URL: "postgresql://voiceforge:voiceforge@localhost:5432/voiceforge" }
      - run: bun run --cwd packages/database test -- --maxWorkers=1
        env: { TEST_DATABASE_URL: "postgresql://voiceforge:voiceforge@localhost:5432/voiceforge" }
      - run: bun run --cwd apps/worker test
        env: { TEST_REDIS_URL: "redis://localhost:6379" }

  containers-and-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: 1.10.5 }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker build -f apps/api/Dockerfile -t voiceforge-api:test .
      - run: docker build -f apps/worker/Dockerfile -t voiceforge-worker:test .
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 -f apps/admin/Dockerfile -t voiceforge-admin:test .
