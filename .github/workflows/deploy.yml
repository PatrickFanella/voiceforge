name: Deploy
on: { workflow_dispatch: { inputs: { environment: { type: choice, options: [staging, production], required: true } } } }
permissions: { contents: read, id-token: write }
concurrency: { group: "deploy-${{ inputs.environment }}", cancel-in-progress: false }
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: "${{ inputs.environment }}"
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: us-east-1 }
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: sigstore/cosign-installer@v3
      - name: Build, push, and sign immutable images
        run: |
          set -euo pipefail
          for service in api worker admin; do
            repository="${{ secrets.ECR_REGISTRY }}/voiceforge-${{ inputs.environment }}-$service"
            docker build --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" -f "apps/$service/Dockerfile" -t "$repository:${GITHUB_SHA}" .
            docker push "$repository:${GITHUB_SHA}"
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$repository:${GITHUB_SHA}")"
            cosign sign --yes "$digest"
            echo "${service}_image=$digest" >> "$GITHUB_ENV"
          done
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - name: Migration preflight
        run: aws ecs run-task --cluster "voiceforge-${{ inputs.environment }}" --task-definition "voiceforge-${{ inputs.environment }}-migration" --launch-type FARGATE --network-configuration "${{ secrets.MIGRATION_NETWORK_CONFIG }}"
      - name: Apply rolling deployment
        run: |
          terraform -chdir=infra/terraform init -backend-config="${{ secrets.TERRAFORM_BACKEND_CONFIG }}"
          terraform -chdir=infra/terraform apply -auto-approve -var="environment=${{ inputs.environment }}" -var="api_image=${api_image}" -var="worker_image=${worker_image}" -var="admin_image=${admin_image}"
      - name: Deep verification
        run: infra/scripts/post-deploy-verify.sh "${{ vars.API_URL }}"
