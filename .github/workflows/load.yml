name: Load Test
on: { workflow_dispatch: { inputs: { api_url: { description: "Staging API URL", required: true, type: string } } } }
permissions: { contents: read }
jobs:
  k6:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with: { path: infra/load/k6.js }
        env: { API_URL: "${{ inputs.api_url }}" }
