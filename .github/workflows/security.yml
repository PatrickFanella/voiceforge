name: Security
on:
  pull_request:
  push: { branches: [master, main] }
  schedule: [{ cron: "17 4 * * 1" }]
permissions: { contents: read, security-events: write, packages: write, id-token: write }
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  secrets-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - uses: ludeeus/action-shellcheck@2.0.0
  images:
    runs-on: ubuntu-latest
    strategy: { matrix: { service: [api, worker, admin] } }
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000 -f apps/${{ matrix.service }}/Dockerfile -t voiceforge-${{ matrix.service }}:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "voiceforge-${{ matrix.service }}:${{ github.sha }}", format: sarif, output: "trivy-${{ matrix.service }}.sarif", severity: "CRITICAL,HIGH", exit-code: "1" }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: "trivy-${{ matrix.service }}.sarif" }
      - uses: anchore/sbom-action@v0
        with: { image: "voiceforge-${{ matrix.service }}:${{ github.sha }}", artifact-name: "${{ matrix.service }}-sbom.spdx.json", output-file: "${{ matrix.service }}-sbom.spdx.json" }
