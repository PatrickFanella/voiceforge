name: voiceforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voiceforge
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: voiceforge
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceforge -d voiceforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: voiceforge
      MINIO_ROOT_PASSWORD: voiceforge-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 voiceforge voiceforge-local-only && mc mb --ignore-existing local/voiceforge-audio local/voiceforge-exports && mc anonymous set none local/voiceforge-audio && mc anonymous set none local/voiceforge-exports"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: ["app"]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://voiceforge:voiceforge@postgres:5432/voiceforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["app"]
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://voiceforge:voiceforge@postgres:5432/voiceforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api: { condition: service_healthy }

  admin:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:3000" }
    env_file: ../.env
    ports: ["3001:3001"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
